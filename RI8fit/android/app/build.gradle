apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native Gradle Plugin Config
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Enable Proguard (R8) for Release builds
 */
def enableProguardInReleaseBuilds = true  // changed to true

/**
 * Use Hermes instead of JSC (smaller + faster)
 */
def enableHermes = true  // force Hermes
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ri8fit"

    defaultConfig {
        applicationId "com.ri8fit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // replace with your keystore for real release
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release

            // Shrink Java + resources
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true

            // ProGuard / R8 rules
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Split per ABI (smaller APKs)
    splits {
    abi {
        enable true
        reset()
        if (getGradle().getStartParameter().getTaskNames().toString().toLowerCase().contains("release")) {
            include "armeabi-v7a", "arm64-v8a" // for release builds
        } else {
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64" // for debug/emulator
        }
        universalApk false
    }
}


    // Java 11 compatibility
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    aaptOptions {
        cruncherEnabled = true
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (enableHermes.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Vector icons font support
project.ext.vectoricons = [
    iconFontNames: [ 'MaterialIcons.ttf' ]
]
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
